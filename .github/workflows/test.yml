name: test
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and every mod
        run: |
          claude plugin validate .
          for m in prime-ctbar prime-agents-panel prime-guard prime-workflow; do claude plugin validate "$m"; done
      - name: Mod tests
        run: |
          for m in prime-ctbar prime-guard prime-agents-panel; do claude plugin test "$m"; done
          node prime-workflow/tests/unit.test.mjs
      - name: Local-only check (no network, model or MCP calls from any mod)
        run: |
          if grep -rnE '\$\.(http|model|mcp)\b|\bfetch\(' --include='*.ts' --include='*.tsx' --exclude-dir=tests */hooks; then
            echo '::error::a mod calls the network, a model or MCP; the local-only statement in README no longer holds'
            exit 1
          fi
      - name: prime-guard engine calls stay on an allowlist
        run: |
          # the engine's own analysis of what the module calls; fail closed if the line is missing
          calls=$(claude plugin validate prime-guard | grep -E 'calls:' | sed 's/.*calls: //')
          [ -n "$calls" ] || { echo '::error::validate printed no calls line for prime-guard'; exit 1; }
          echo "$calls"
          bad=$(echo "$calls" | tr ',' '\n' | sed -E 's/^ *\$\.([a-z]+).*/\1/' | sort -u | grep -vxE 'state|ui|clock|command|process' || true)
          [ -z "$bad" ] || { echo "::error::prime-guard calls outside state, ui, clock, command, process: $bad"; exit 1; }
      - name: JSON manifests parse
        run: for f in .claude-plugin/*.json .agents/plugins/*.json */.claude-plugin/plugin.json */.codex-plugin/plugin.json */hooks/hooks.json; do python3 -m json.tool "$f" > /dev/null; done
      - name: Codex install
        run: |
          npm install -g @openai/codex
          export CODEX_HOME="$RUNNER_TEMP/codex"
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$PWD"
          codex plugin add prime-workflow@prime-studio-mods
          codex plugin list | grep -q prime-workflow
